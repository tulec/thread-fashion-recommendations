[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-recs"
version = "0.1.0"
description = "A reproducible fashion recommendation portfolio project"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3", "scikit-learn>=1.4,<2"]

[project.scripts]
fashion-recs = "fashion_recs.pipeline:main"

[tool.setuptools.packages.find]
include = ["fashion_recs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

